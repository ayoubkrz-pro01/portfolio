<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Générateur de palettes</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #111; color: #fff; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 20px; flex-wrap: wrap; }
  .top h1 { font-size: 1.1rem; margin: 0; }
  .top p { margin: 0; color: #aaa; font-size: .9rem; }
  button { font: inherit; cursor: pointer; border: 0; border-radius: 8px; padding: 8px 16px; background: #fff; color: #111; font-weight: 600; }
  #palette { display: flex; height: calc(100vh - 70px); }
  .color { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 10px; padding-bottom: 40px; transition: background .25s; }
  .color .hex { font-size: 1.3rem; font-weight: 700; letter-spacing: .05em; cursor: pointer; }
  .color .lock { background: rgba(0,0,0,.2); color: inherit; font-size: .85rem; }
  .color.locked .lock { background: rgba(0,0,0,.55); color: #fff; }
  #msg { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: #fff; color: #111; padding: 8px 16px; border-radius: 8px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  #msg.show { opacity: 1; }
  @media (max-width: 600px) { #palette { flex-direction: column; } .color { flex-direction: row; justify-content: space-around; padding: 0; } }
</style>
</head>
<body>
<div class="top">
  <div>
    <h1>Générateur de palettes</h1>
    <p>Barre d'espace ou bouton pour générer · clic sur un code pour le copier</p>
  </div>
  <button id="generate">Générer</button>
</div>

<div id="palette"></div>
<div id="msg"></div>

<script>
  const COUNT = 5;
  const paletteEl = document.getElementById("palette");
  const msgEl = document.getElementById("msg");

  // Chaque couleur = { hex, locked }
  let colors = [];

  // Couleur aléatoire en HSL (teinte, saturation, luminosité), convertie en hexadécimal.
  function randomHex() {
    const h = Math.random() * 360;
    const s = 45 + Math.random() * 40;
    const l = 30 + Math.random() * 45;
    return hslToHex(h, s, l);
  }

  function hslToHex(h, s, l) {
    s /= 100; l /= 100;
    const k = n => (n + h / 30) % 12;
    const a = s * Math.min(l, 1 - l);
    const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
    const toHex = x => Math.round(x * 255).toString(16).padStart(2, "0");
    return "#" + toHex(f(0)) + toHex(f(8)) + toHex(f(4));
  }

  // Choisit texte noir ou blanc selon la luminosité du fond, pour que ça reste lisible.
  function textColor(hex) {
    const r = parseInt(hex.slice(1, 3), 16);
    const g = parseInt(hex.slice(3, 5), 16);
    const b = parseInt(hex.slice(5, 7), 16);
    return (r * 299 + g * 587 + b * 114) / 1000 > 150 ? "#111" : "#fff";
  }

  function generate() {
    for (let i = 0; i < COUNT; i++) {
      if (!colors[i]) colors[i] = { hex: randomHex(), locked: false };
      else if (!colors[i].locked) colors[i].hex = randomHex();
    }
    render();
  }

  function render() {
    paletteEl.innerHTML = "";
    colors.forEach((c, i) => {
      const div = document.createElement("div");
      div.className = "color" + (c.locked ? " locked" : "");
      div.style.background = c.hex;
      div.style.color = textColor(c.hex);

      const hex = document.createElement("span");
      hex.className = "hex";
      hex.textContent = c.hex.toUpperCase();
      hex.onclick = () => copy(c.hex.toUpperCase());

      const lock = document.createElement("button");
      lock.className = "lock";
      lock.textContent = c.locked ? "Verrouillée" : "Verrouiller";
      lock.onclick = () => { c.locked = !c.locked; render(); };

      div.append(hex, lock);
      paletteEl.append(div);
    });
  }

  function copy(text) {
    navigator.clipboard.writeText(text).then(() => {
      msgEl.textContent = text + " copié";
      msgEl.classList.add("show");
      setTimeout(() => msgEl.classList.remove("show"), 1200);
    });
  }

  document.getElementById("generate").onclick = generate;
  document.addEventListener("keydown", e => {
    if (e.code === "Space") { e.preventDefault(); generate(); }
  });

  generate();
</script>
</body>
</html>
